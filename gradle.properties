# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=16.0.0-alpha.1
group=dex.autoswitch
java_version=25

# Common
minecraft_version=26.2-rc-1
mod_name=AutoSwitch
mod_author=Deximus-Maximus
mod_id=autoswitch
license=LGPL-3.0
credits=
description=Automatic switching of tools on the hotbar to the best one for the job.
# Neo does not properly handle snapshots in version ranges,
# the release build will fail the version range that uses snapshots.
# As a workaround, `-alpha` on the version will match all snapshots.
neo_mc_version_range=[26.2-alpha, 26.3)
fab_mc_version_range=>=26.2-alpha.8 <26.3
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-rc-1-1
configurate_version=4.2.0

# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.11
parchment_version=2025.12.20

# Fabric https://fabricmc.net/develop/
fabric_version=0.152.0+26.2
fabric_loader_version=0.19.3

# Forge
forge_version=51.0.17
forge_loader_version_range=[51,)

# NeoForge https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.2.0-alpha.0+rc-1.20260611.132638
# Needed to set the maven repository for the PR builds
# https://github.com/neoforged/NeoForge/issues?q=state%3Aopen%20label%3Aporting
neoforge_pr_build_pr=3198

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configureondemand=true
org.gradle.warning.mode=all

# Other settings to experiment with
org.gradle.unsafe.isolated-projects=true
# Develocity is incompatible with project isolation
#com.gradleup.shadow.enableDevelocityIntegration=false
