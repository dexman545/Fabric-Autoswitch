name: Mod Publishing

on:
  workflow_dispatch:
    inputs:
      publish_curseforge:
        description: 'Publish to CurseForge'
        type: boolean
        default: true
      publish_modrinth:
        description: 'Publish to Modrinth'
        type: boolean
        default: true
      publish_fabric:
        description: 'Publish Fabric version'
        type: boolean
        default: true
      publish_neoforge:
        description: 'Publish NeoForge version'
        type: boolean
        default: true
  push:
    tags:
      - '*'
      - '!no-publish/**'

jobs:
  publish:
    if: ${{ !startsWith(github.ref_name, 'no-publish/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Update Neoforge resource cache if needed
      - uses: neoforged/actions-modding/minecraft-assets-cache/create@v1
        with:
          minecraft-versions: |

          minecraft-version-file: gradle.properties
          minecraft-version-regexp: /^\s*minecraft_version\s*=\s*(.+)\s*$/m

      - name: Setup Minecraft Assets Cache
        uses: neoforged/actions-modding/minecraft-assets-cache/use@v1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build with Gradle
        run: ./gradlew publishModsConditional
          -Ppublish_curseforge=${{ inputs.publish_curseforge != '' && inputs.publish_curseforge || 'true' }}
          -Ppublish_modrinth=${{ inputs.publish_modrinth != '' && inputs.publish_modrinth || 'true' }}
          -Ppublish_fabric=${{ inputs.publish_fabric != '' && inputs.publish_fabric || 'true' }}
          -Ppublish_neoforge=${{ inputs.publish_neoforge != '' && inputs.publish_neoforge || 'true' }}
        env:
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASS }}
          KEY_STORE_ALIAS: ${{ secrets.KEY_STORE_ALIAS }}
          KEY_STORE_KEY_PASS: ${{ secrets.KEY_STORE_KEY_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH: ${{ secrets.MODRINTH }}
          CURSE: ${{ secrets.CURSE }}
